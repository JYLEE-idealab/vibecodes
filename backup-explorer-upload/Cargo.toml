[package]
name = "backup-explorer"
version = "1.2.0"
edition = "2021"
description = "Windows 10 File Explorer style PC & External Drive Backup/Duplicate Analyzer"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"
walkdir = "2.5"
blake3 = "1.5"
rayon = "1.10"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "ico", "tiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
