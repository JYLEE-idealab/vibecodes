plugins {
    id 'com.android.application' version '8.7.2'
}

android {
    namespace 'com.tabmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.tabmonitor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
